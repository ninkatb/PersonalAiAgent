# BMAD konfiguracija projekta

project:
  name: "Personal AI Agent"
  type: "other"  # Desktop aplikacija; mašinska vrijednost iz BMAD šeme.
  level: 3    # Opsežan projekat sa vaultom i vanjskim integracijama; raspon 0–4.
  description: "Privatni AI agent za jednog vlasnika po instalaciji, sa sopstvenim API ključevima i lokalnim desktop interfejsom."

paths:
  output_folder: "docs"
  stories_folder: "docs/stories"
  status_file: "bmad/workflow-status.yaml"
  sprint_file: "bmad/sprint-status.yaml"

language:
  communication_language: "Srpski (latinica, ijekavica u upotrebi u Republici Srpskoj; nisu, nisam, sutra)"
  document_output_language: "Srpski (latinica, ijekavica u upotrebi u Republici Srpskoj; nisu, nisam, sutra)"

workflow:
  phase_1_analysis:
    product_brief: "required"  # Mašinske vrijednosti: required, recommended, optional.
    research: "optional"
    brainstorm: "optional"

  phase_2_planning:
    prd: "required"
    tech_spec: "optional"
    ux_design: "recommended"

  phase_3_solutioning:
    architecture: "required"
    gate_check: "recommended"

  phase_4_implementation:
    sprint_planning: "required"
    stories: "required"

